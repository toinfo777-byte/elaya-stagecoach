# 🔱 ЭЛАЙЯ · HQ RULES
## Основные принципы работы сервисов, ботов и ритмических систем

Документ фиксирует стратегические правила, необходимые для стабильной работы архитектуры Элайи, сохранения ритма, таймлайна и будущей масштабируемости.

---

# 🔱 Правило №1 — Ритм выше инфраструктуры
Ритм тренера, HQ и сценических слоёв является основой.  
Технические решения выбираются так, чтобы никогда не нарушать:

- последовательность шагов,
- детерминизм,
- чистоту сцены,
- непрерывность цикла.

---

# 🔱 Правило №2 — Timeline является источником истины
Все события (trainer, HQ, scene, core) фиксируются в `/api/timeline`  
Ничто не считается свершившимся, пока не записано в timeline.

---

# 🔱 Правило №3 — GUARD защищает мутацию
Любое изменение состояния ядра (trainer/daystart, trainer/done, HQ-сцены, service-события) проходит только при корректном `X-Guard-Key`.

---

# 🔱 Правило №4 — Core отвечает только за состояние
Ядро Элайи не должно содержать бизнес-логики ботов.  
Оно:

- принимает события,
- ведёт timeline,
- возвращает summary,
- хранит цикл.

Поведение ботов — в их собственных слоях.

---

# 🔱 Правило №5 — Разделение: Web / Worker / CLI
**Web Service** отвечает только за HTTP.  
**Worker** выполняет бесконечные процессы (боты, фоновые задачи).  
**CLI** — локальный инструмент присутствия.

Смешивать роли запрещено.

---

# 🔱 Правило №6 — Webhook ИЛИ Polling, но никогда оба
Если бот работает на webhook — polling невозможен.  
Если бот работает на polling — webhook не должен быть активен.

---

# 🔱 Правило №7 — Single-Consumer Token Discipline
## (одно из ключевых фундаментальных правил)

### 📌 Формула:
**Один токен — один активный исполнитель.**

### 📌 Расшифровка:
Каждый Telegram-бот Элайи может иметь **только одного** потребителя обновлений:

- либо Worker (polling),
- либо Web Service (webhook),
- но не два одновременно.

### 📌 Почему это критично:
- Telegram даёт поток обновлений только одному получателю.
- Второй процесс вызывает **TelegramConflictError**.
- В результате:
  - сцены теряются,
  - происходит раздвоение ритма,
  - ломается логика тренера,
  - timeline получает неверные состояния.

### 📌 Применение:
- Если бот работает на Render — локальный запуск запрещён.
- Если идёт локальная отладка — Render Worker ставится в Pause/Suspend.
- Запрещены:
  - 2 worker'а с одним токеном,
  - web-service + worker с одним токеном,
  - локальный python + Render worker одновременно.

### 📌 Принцип сцены:
Один токен = один голос.  
Один голос = один ритм.  
Один ритм = чистая сцена.

---

# 🔱 Правило №8 — Версии ядра фиксируются в meta.py
Любые обновления (добавление сцен, исправления, новые поля) меняют CORE_VERSION.

---

# 🔱 Правило №9 — Сервисное состояние не смешивается с пользовательским
SQLite, timeline, состояния циклов и оперативные данные разделяются.

---

# 🔱 Правило №10 — Логика тренера не тестируется на боевом токене
Для разработки используется отдельный bot-token.  
Боевой токен — только для Render.

---

# 🔱 Дополнение: HQ Pulse
HQ Pulse можно включать/выключать вручную.  
Он используется для согласования:

- версий,
- статуса сервисов,
- актуальности токенов,
- состояния ядра.

